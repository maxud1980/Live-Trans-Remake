# Own bundle id (NOT the upstream author's): macOS TCC stores permissions per bundle id + code
# signature, so sharing an id with the original app (signed by a different team) makes the
# stored consent fail its code requirement and the prompts reappear.
appId: com.maxud1980.live-trans-remake
productName: live-trans
copyright: Copyright © 2026 minhnhat165

directories:
  output: release
  buildResources: build

# electron-vite emits the app into out/; package.json "main" points at out/main/index.js.
files:
  - out/**
  - package.json

asar: true
# The audiotee Swift binary must live outside the asar archive so we can spawn it.
asarUnpack:
  - "**/node_modules/audiotee/bin/**"

mac:
  category: public.app-category.utilities
  minimumSystemVersion: "14.2"
  target:
    - target: dmg
      arch:
        - universal
  # NO pinned identity here. The previous value was the upstream author's Developer ID, which
  # does not exist on CI or on this machine, so electron-builder silently produced an UNSIGNED
  # app ("no automatic ad-hoc fallback"). An unsigned/inconsistently signed app has no stable
  # code identity, so macOS TCC cannot remember the microphone consent and asks again.
  # CI passes `-c.mac.identity=-` (explicit ad-hoc) when no real certificate secret is set;
  # with CSC_LINK / CSC_KEY_PASSWORD set, the Developer ID certificate is auto-discovered.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Notarization is opt-in: pass `-c.mac.notarize=true` together with APPLE_ID /
  # APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (see docs/BUILD.md). Ad-hoc builds can't be notarized.
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: live-trans uses your selected microphone as the translation source.
    NSAudioCaptureUsageDescription: live-trans captures system audio to translate it in real time.

dmg:
  title: live-trans ${version}

win:
  icon: build/icon-1024.png
  target:
    - target: nsis
      arch:
        - x64
  # The WASAPI loopback helper is our own binary (built from native/win-audio-capture), not an
  # npm dependency, so we copy it in as an extra resource rather than asarUnpack'ing node_modules.
  # In the main process it is resolved at process.resourcesPath/win-audio-capture/.
  extraResources:
    - from: native/win-audio-capture/build/Release/live-trans-capture.exe
      to: win-audio-capture/live-trans-capture.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
