# This fork uses its own bundle identifier so macOS TCC records do not collide with upstream.
appId: com.maxud1980.live-trans-remake
productName: live-trans
copyright: Copyright © 2026 minhnhat165

directories:
  output: release
  buildResources: build

# electron-vite emits the app into out/; package.json "main" points at out/main/index.js.
files:
  - out/**
  - package.json

asar: true
# The audiotee Swift binary must live outside the asar archive so we can spawn it.
asarUnpack:
  - "**/node_modules/audiotee/bin/**"

mac:
  category: public.app-category.utilities
  minimumSystemVersion: "14.2"
  target:
    - target: dmg
      arch:
        - universal
  # Signing identity is selected by CI: Developer ID when CSC_LINK is provided, otherwise
  # explicit ad-hoc signing via -c.mac.identity=-.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Ad-hoc builds cannot be notarized. CI enables notarization only with credentials.
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: live-trans uses your selected microphone as the translation source.
    NSAudioCaptureUsageDescription: live-trans captures system audio to translate it in real time.

dmg:
  title: live-trans ${version}

win:
  icon: build/icon-1024.png
  target:
    - target: nsis
      arch:
        - x64
  # The WASAPI loopback helper is our own binary (built from native/win-audio-capture), not an
  # npm dependency, so we copy it in as an extra resource rather than asarUnpack'ing node_modules.
  # In the main process it is resolved at process.resourcesPath/win-audio-capture/.
  extraResources:
    - from: native/win-audio-capture/build/Release/live-trans-capture.exe
      to: win-audio-capture/live-trans-capture.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
