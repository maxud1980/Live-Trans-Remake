name: Build Live Trans

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows package
        run: bun run dist:win -- --publish never

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: live-trans-windows
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: error

  build-macos:
    name: macOS Apple Silicon
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build macOS package
        env:
          # Optional: real Developer ID certificate (base64 .p12) + password + notarization creds.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            if [ -n "$APPLE_ID" ]; then
              bun run dist:mac -- --publish never -c.mac.notarize=true
            else
              bun run dist:mac -- --publish never
            fi
          else
            # No certificate: request ad-hoc signing for trusted builds.
            unset CSC_LINK CSC_KEY_PASSWORD
            bun run dist:mac -- --publish never -c.mac.identity=-
          fi

      # electron-builder intentionally skips code signing for pull_request builds.
      # Verify signatures only on trusted push/tag builds; PR builds still compile and package.
      - name: Verify code signature and entitlements
        if: github.event_name != 'pull_request'
        run: |
          APP="$(ls -d release/mac*/live-trans.app | head -1)"
          test -n "$APP"
          echo "App: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "--- main app"
          codesign -dvv "$APP" 2>&1 | grep -E 'Identifier|Authority|Signature|TeamIdentifier|flags' || true
          codesign -d --entitlements - "$APP" 2>&1 | grep -E 'audio-input' || (echo 'audio-input entitlement missing' && exit 1)
          echo "--- helpers"
          for h in "$APP"/Contents/Frameworks/*Helper*.app; do
            echo "$h"; codesign -dvv "$h" 2>&1 | grep -E 'Identifier|Signature|TeamIdentifier' || true
          done
          echo "--- audiotee"
          find "$APP" -path '*audiotee/bin/audiotee' -exec codesign -dvv {} \; 2>&1 | grep -E 'Identifier|Signature|flags' || true

      - name: Verify PR package exists
        if: github.event_name == 'pull_request'
        run: |
          test -f release/live-trans-0.1.12-universal.dmg
          echo "PR build packaged successfully; code-signature checks run on trusted push/tag builds."

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: live-trans-macos-arm64
          path: release/*.dmg
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Extract release notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release $GITHUB_REF_NAME" > RELEASE_NOTES.md
          fi

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: live-trans-windows
          path: artifacts/windows

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: live-trans-macos-arm64
          path: artifacts/macos

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              artifacts/windows/* \
              artifacts/macos/* \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Live Trans $GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md \
              artifacts/windows/* \
              artifacts/macos/*
          fi
